<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- 只有特权 helper 能拥有名称；任意用户可调用，helper 按 UID 过滤结果。 -->
  <policy user="root">
    <allow own="com.trafficview.Ebpf1"/>
    <allow send_destination="com.trafficview.Ebpf1"/>
  </policy>
  <policy context="default">
    <allow send_destination="com.trafficview.Ebpf1"/>
  </policy>
</busconfig>
