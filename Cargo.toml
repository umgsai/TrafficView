[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/collectors",
    "crates/plugin-proto",
    "crates/daemon",
    "crates/render",
    "crates/ui-x11",
    "crates/ui-wayland",
    "crates/tray",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
