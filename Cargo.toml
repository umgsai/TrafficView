[workspace]
resolver = "2"
# frontends/settings 是独立 workspace（依赖 GTK4/libadwaita），根构建不得解析它；
# crates/netprobe-ebpf 的 eBPF 内核侧推迟实现，创建后同样作为独立 workspace 排除。
exclude = ["frontends/settings", "crates/netprobe-ebpf"]
members = [
    "crates/core",
    "crates/collectors",
    "crates/plugin-proto",
    "crates/daemon",
    "crates/render",
    "crates/ui-x11",
    "crates/ui-wayland",
    "crates/tray",
    "crates/cli",
]

[workspace.package]
version = "1.1.0"
edition = "2021"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
