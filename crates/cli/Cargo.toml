[package]
name = "trafficview-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "trafficview"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
trafficview-core = { path = "../core" }
trafficview-collectors = { path = "../collectors" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
