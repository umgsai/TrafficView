[package]
name = "trafficview-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "trafficview"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = "1"
serde_json = "1"
toml = "0.8"
zbus = "4"
trafficview-core = { path = "../core" }
trafficview-collectors = { path = "../collectors" }
trafficview-daemon = { path = "../daemon" }
trafficview-ui-x11 = { path = "../ui-x11" }
trafficview-tray = { path = "../tray" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
