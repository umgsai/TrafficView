[package]
name = "trafficview-daemon"
version.workspace = true
edition.workspace = true
description = "TrafficView sampling daemon and D-Bus v1 service"

[features]
# eBPF 进程流量内核侧（crates/netprobe-ebpf）在 Task 4 Step 3 推迟实现；
# 此 feature 为占位，当前启用不改变行为，由 AF_PACKET 或 available=false 降级。
process-ebpf = []

[lib]
name = "trafficview_daemon"
path = "src/lib.rs"

[[bin]]
name = "trafficviewd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }
futures-util = "0.3"
trafficview-core = { path = "../core" }
trafficview-collectors = { path = "../collectors" }
trafficview-plugin-proto = { path = "../plugin-proto" }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
libc = "0.2"

[[bin]]
name = "trafficviewd-ebpf"
path = "src/bin/trafficviewd-ebpf.rs"

[dev-dependencies]
futures-util = "0.3"
tempfile = "3"
