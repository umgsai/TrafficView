[package]
name = "trafficview-render"
version.workspace = true
edition.workspace = true

[dependencies]
trafficview-core = { path = "../core" }
tiny-skia = "0.11"
cosmic-text = "0.12"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "render"
harness = false
