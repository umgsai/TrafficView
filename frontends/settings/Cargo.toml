# 独立 workspace：根 workspace 通过 exclude 排除本目录，因此根构建不会解析 GTK 依赖。
[workspace]
resolver = "2"
members = ["."]

[package]
name = "trafficview-settings"
version = "1.1.1"
edition = "2021"
description = "TrafficView 独立 GTK4/libadwaita 设置界面"

[[bin]]
name = "trafficview-settings"
path = "src/main.rs"

[dependencies]
# 本机已安装 GTK 4.14.5 与 libadwaita 1.5.0；feature 与系统库版本对齐。
gtk4 = { version = "0.11", features = ["v4_14"] }
libadwaita = { version = "0.9", features = ["v1_5", "gtk_v4_10"] }
glib = "0.22"
zbus = { version = "4", default-features = false, features = ["tokio"] }
zvariant = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"
async-channel = "2"
trafficview-core = { path = "../../crates/core" }

[dev-dependencies]
tempfile = "3"

# 独立 workspace 不继承根 `[profile.release]`，打包用的设置界面同样剥离符号。
[profile.release]
strip = true
